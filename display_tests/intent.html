<!doctype html> <html lang="en-US">   <head>     <meta charset="UTF-8" />     <title>MathML</title>   </head>   <body>     <h1>MathML - intent </h1> <ol><li>
</br>
<p>
<math> <mn>2</mn> <mi intent=':silent'>x</mi></math></br></br>
</p>
</li>
<hr><li>
</br>
<p>
<math>
        <msup intent='index:silent($H,$n)'>
            <mi arg='H' mathvariant='normal'>H</mi>
            <mn arg='n'>2</mn>
        </msup></math></br></br>
</p>
</li>
<hr><li>
</br>
<p>
<math>
        <msup intent='_($H,$n)'>
            <mi arg='H' mathvariant='normal'>H</mi>
            <mn arg='n'>2</mn>
        </msup></math></br></br>
</p>
</li>
<hr><li>
</br>
<p>
<math>
    <msup intent='$op($arg)'>
        <mi arg='arg'>x</mi>
        <mi arg='op' intent='probability' mathvariant='normal'>P</mi>
    </msup></math></br></br>
</p>
</li>
<hr></ol> </body> </html>
